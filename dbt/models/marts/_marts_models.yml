version: 2

models:
  - name: dim_currency
    description: "One row per currency: name, type, first and last seen dates, and whether CBAR still publishes it."
    columns:
      - name: currency_code
        data_tests:
          - not_null
          - unique

      - name: currency_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metal', 'currency']

      - name: is_active
        data_tests:
          - not_null

  - name: dim_date
    description: "One row per calendar day from the first CBAR rate date to today, with date parts and whether CBAR published rates that day."
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

      - name: is_publication_day
        data_tests:
          - not_null

      - name: is_weekend
        data_tests:
          - not_null

  - name: fact_exchange_rate
    description: "One row per currency per CBAR publication date, with rate per unit and change from the previous publication."
    columns:
      - name: rate_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: currency_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_code
      - name: rate_per_unit
        data_tests:
          - not_null
  
  - name: fact_exchange_rate_daily
    description: "One row per currency per calendar day. On days without a CBAR publication, the last published rate is carried forward and flagged."
    columns:
      - name: date_day
        data_tests:
          - not_null
      - name: rate_per_unit
        data_tests:
          - not_null
      - name: is_carried_forward
        data_tests:
          - not_null
      - name: currency_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_code

