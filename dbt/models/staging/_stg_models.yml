version: 2

models:
  - name: stg_cbar_rates
    description: "Cleaned CBAR exchange rates, one row per currency per day."
    columns:
      - name: rate_date
        data_tests:
          - not_null
      - name: currency_code
        data_tests:
          - not_null
      - name: currency_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metal', 'currency']
      - name: nominal
        data_tests:
          - not_null
      - name: rate_per_unit
        data_tests:
          - not_null