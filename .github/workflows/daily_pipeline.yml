name: Daily FX pipeline

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      FX_DB_PATH: md:fx_pipeline
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract and load
        run: python src/backfill.py

      - name: Check source freshness
        working-directory: dbt
        run: dbt source freshness --target prod

      - name: Build and test models
        working-directory: dbt
        run: dbt build --target prod

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="FX pipeline FAILED. Logs: ${RUN_URL}"